# Packaging for Extalia Desktop: `pnpm dist` (installers) or `pnpm dist:dir` (unpacked app).
#
# Signing and notarization come only from electron-builder's standard environment
# variables: CSC_LINK + CSC_KEY_PASSWORD (macOS Developer ID certificate),
# APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID or APPLE_API_KEY +
# APPLE_API_KEY_ID + APPLE_API_ISSUER (notarization), WIN_CSC_LINK +
# WIN_CSC_KEY_PASSWORD (Windows). Unsigned local builds: CSC_IDENTITY_AUTO_DISCOVERY=false.
appId: io.github.extalia-vo.desktop
productName: Extalia
copyright: Copyright © Extalia contributors
directories:
  output: release
  buildResources: build
# main.cjs and preload.cjs are self-contained esbuild bundles (only `electron` is external),
# so the app ships without node_modules; pnpm's symlinked workspace packages are never copied.
files:
  - dist/**
  - '!dist/**/*.map'
  - package.json
beforeBuild: ./scripts/skip-node-modules.mjs
extraMetadata:
  # Packaged name used for the updater cache and Linux package names, and the display name at runtime.
  name: extalia-desktop
  productName: Extalia
# The web UI is read from process.resourcesPath/web (see src/main.ts).
extraResources:
  - from: ../web/dist
    to: web
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip feeds macOS auto-updates.
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}

linux:
  category: Development
  # `extalia` on PATH belongs to the CLI (npm package extalia-vo); the desktop app uses its own name.
  executableName: extalia-desktop
  maintainer: Extalia contributors
  synopsis: Spatial workspace for AI agents
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

publish:
  provider: github
  owner: Extalia-VO
  repo: extalia-virtual-agent
