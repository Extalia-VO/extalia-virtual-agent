[package]
name = "extalia-daemon"
description = "Extalia sidecar daemon: daemon wire contract v1 over stdio."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
extalia-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2.workspace = true
serde.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[features]
# Explicitly enabled by the Rust test gate, never by release packaging.
test-fixtures = []

[[bin]]
name = "extalia-daemon"
path = "src/main.rs"

[[bin]]
name = "extalia-worker-fixture"
path = "tests/support/worker_fixture.rs"
test = false
required-features = ["test-fixtures"]

[[bin]]
name = "extalia-python-bundle-probe"
path = "tests/support/python_bundle_probe.rs"
test = false
required-features = ["test-fixtures"]

[dev-dependencies]
# Integration tests inspect core.sqlite directly after killing the daemon.
rusqlite.workspace = true

[lints]
workspace = true
