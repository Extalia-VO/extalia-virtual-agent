name: Release

# Pushing a tag such as v0.1.0 builds Extalia Desktop/Web and uploads validated installers,
# Web ZIP, packed npm tarballs and update metadata to a draft GitHub release. A maintainer
# reviews the draft and publishes it; installed apps only see published releases.
#
# Installers are self-contained (owner decision 9, ADR 0021): the `daemon` matrix builds the
# Rust sidecar once per target, the Desktop builds bundle it, and the `npm-packages` job
# generates the CLI's per-platform packages from the same binaries. Both pass a "clean
# machine" smoke with no Rust, Python, Node or npm reachable (docs/release/packaging.md).
# Nothing is published to npm. Publish the draft only when every job is green.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches the app version
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop version $version."
            exit 1
          fi
      # One draft up front, so the parallel builds upload to the same release instead of racing to create it.
      # Tags with a pre-release part (v0.2.0-beta.1) become GitHub pre-releases, which only the beta update channel installs.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $prerelease --verify-tag --title "Extalia $GITHUB_REF_NAME" --generate-notes

  daemon:
    name: Daemon (${{ matrix.target }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on the Apple-silicon runner (x86_64 cross-compiles with Xcode's toolchain).
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-apple-darwin, runner: macos-latest }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
          # Linux builds run natively on Ubuntu 22.04 (x64 and arm64 hosted runners), which sets the glibc floor (2.35).
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # The Arm-hosted Linux image may lack rustup; the others ship it.
      - name: Install rustup if missing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      # The exact toolchain pinned in rust-toolchain.toml, plus the matrix target.
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Release build, symbols stripped, architecture checked; a native binary must answer `hello`.
      - run: node tooling/build-daemon.mjs --target ${{ matrix.target }} --out daemon-artifacts
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          floor=2.35
          needed="$(objdump -T daemon-artifacts/*/extalia-daemon | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)"
          echo "extalia-daemon needs glibc $needed (floor $floor)"
          if [ "$(printf '%s\n%s\n' "$needed" "$floor" | sort -V | tail -1)" != "$floor" ]; then
            echo "::error::extalia-daemon needs glibc $needed, newer than the supported floor $floor."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.target }}
          # daemon-artifacts/<platform>-<arch>/extalia-daemon[.exe]; artifacts drop the executable bit,
          # so every consumer stages the file with build-daemon --from or generate.mjs, which restore it.
          path: daemon-artifacts/
          if-no-files-found: error
          retention-days: 14

  npm-packages:
    name: CLI npm packages (dry run)
    needs: [draft, daemon]
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @extalia/web build
      - run: pnpm --filter extalia-vo build
      - uses: actions/download-artifact@v4
        with:
          pattern: daemon-*
          path: daemon-artifacts
          merge-multiple: true
      # Five @extalia/daemon-<platform>-<arch> packages plus extalia-vo with them as optional dependencies.
      - run: node apps/cli/npm/generate.mjs --binaries daemon-artifacts --out npm-packages --require-all --cli
      # npm install -g of the packed CLI + linux-x64 package, then run with no toolchain on PATH.
      - run: node tooling/clean-machine-smoke.mjs --npm npm-packages
      - name: Pack (not published)
        shell: bash
        run: |
          mkdir -p npm-tarballs
          for dir in npm-packages/*/; do npm pack --pack-destination npm-tarballs "$dir"; done
          ls -l npm-tarballs
      - name: Verify six version-matched tarballs
        run: node tooling/package-release-assets.mjs npm --directory npm-tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-tarballs/
          if-no-files-found: error
          retention-days: 14
      - name: Upload validated tarballs to the draft (not npm publication)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tooling/package-release-assets.mjs draft
          gh release upload "$GITHUB_REF_NAME" npm-tarballs/*.tgz --clobber

  web:
    name: Web distribution ZIP
    needs: draft
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build a fresh public Web distribution
        run: |
          node -e "require('node:fs').rmSync('apps/web/dist', { recursive: true, force: true })"
          pnpm --filter @extalia/web build
      - name: Validate registered models and package Web files
        run: node tooling/package-release-assets.mjs web --out release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: web-distribution
          path: release-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload the validated Web ZIP to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tooling/package-release-assets.mjs draft
          gh release upload "$GITHUB_REF_NAME" release-artifacts/*.zip --clobber

  build:
    name: Build (${{ matrix.os }})
    needs: [draft, daemon]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder downloads the Electron release it packages; the npm binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Free preview distribution is ad-hoc signed and shows Apple's unidentified-developer warning.
      # Set this repository variable to notarized when Developer ID credentials are available.
      EXTALIA_MAC_RELEASE_MODE: ${{ vars.EXTALIA_MAC_RELEASE_MODE || 'preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check macOS release mode (preview or notarized)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node apps/desktop/scripts/release.mjs preflight
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @extalia/web build
      - run: pnpm --filter @extalia/desktop build
      - uses: actions/download-artifact@v4
        with:
          pattern: daemon-*
          path: daemon-artifacts
          merge-multiple: true
      # Stage the daemon for every arch this OS packages (electron-builder.yml: macOS arm64 + x64,
      # Windows x64, Linux x64) at apps/desktop/build-resources/daemon/<os>-<arch>/; no Rust here.
      - name: Stage the daemon
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) targets="darwin-arm64 darwin-x64" ;;
            Windows) targets="win32-x64" ;;
            *) targets="linux-x64" ;;
          esac
          for target in $targets; do
            binary="daemon-artifacts/$target/extalia-daemon"
            if [ "$RUNNER_OS" = "Windows" ]; then binary="$binary.exe"; fi
            node tooling/build-daemon.mjs --target "$target" --from "$binary"
          done
      - name: Package without publishing
        working-directory: apps/desktop
        # Preview: explicitly ad-hoc signed, no notarization; manual downloads only.
        # Notarized: requires Developer ID signing and notarization credentials.
        # Local pnpm dist remains available without signing credentials.
        env:
          EXTALIA_REQUIRE_DAEMON: '1'
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: node scripts/release.mjs package
      # Clean-machine gate on the unpacked app electron-builder left in release/ (this runner's arch):
      # the daemon answers `hello`, and the app passes --smoke-test with and without it, with no
      # Rust/Python/Node/npm reachable. No installer or update feed is uploaded before this passes.
      - name: Packaged smoke (clean machine)
        if: runner.os != 'Linux'
        working-directory: apps/desktop
        run: node scripts/packaged-smoke.mjs
      - name: Packaged smoke (clean machine)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        # Ubuntu runners restrict unprivileged user namespaces, which Chromium's sandbox needs.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum node scripts/packaged-smoke.mjs
      - name: Verify distribution and upload validated files to the draft
        working-directory: apps/desktop
        # On macOS, both DMGs are mounted read-only and both updater ZIPs are extracted.
        # Both modes require valid deep/strict app signatures and resources for every archive.
        # Notarized also requires Developer ID, Gatekeeper acceptance and a stapled ticket.
        # Preview uploads a warning notice and excludes update metadata and block maps.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs upload
      - name: Retain unverified macOS archives for failure diagnosis
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: unverified-macos-${{ github.ref_name }}
          path: |
            apps/desktop/release/*-mac-*.dmg
            apps/desktop/release/*-mac-*.zip
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0

  checksums:
    name: Complete draft release checksums
    # A partial or failed matrix must never look like a complete release inventory.
    needs: [draft, daemon, build, npm-packages, web]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXTALIA_MAC_RELEASE_MODE: ${{ vars.EXTALIA_MAC_RELEASE_MODE || 'preview' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Download every completed draft asset
        run: |
          node tooling/package-release-assets.mjs draft
          mkdir release-checksums
          gh release download "$GITHUB_REF_NAME" --dir release-checksums
      - name: Verify complete inventory and generate checksums
        run: node tooling/package-release-assets.mjs checksums --directory release-checksums --mac-mode "$EXTALIA_MAC_RELEASE_MODE"
      - name: Upload checksums to the same draft
        run: |
          node tooling/package-release-assets.mjs draft
          gh release upload "$GITHUB_REF_NAME" release-checksums/SHA256SUMS.txt --clobber
