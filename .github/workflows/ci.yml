name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Lint, tests and builds do not need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node tooling/check-versions.mjs

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Installs the exact toolchain, rustfmt and clippy pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # fmt --check, clippy -D warnings and tests, all --locked (same gate as pnpm check).
      - run: node tooling/check-rust.mjs
      # Host suites that need the real daemon binary; the `check` job skips them without Rust.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node tooling/check-rust.mjs --build-daemon
      # Include newly added planning, admission, recovery and scanner/learning suites;
      # the non-Rust check job alone would silently skip their real-daemon cases.
      # One file at a time: parallel daemons starve small Windows runners into startup timeouts.
      - run: pnpm exec vitest run packages/host/test --maxWorkers=1
      # Smoke check only, not a gate: the benchmark numbers are not compared in CI.
      - run: node tooling/bench/native-core.mjs --quick --json
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true

  desktop-smoke:
    name: Desktop smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu runners restrict unprivileged user namespaces, which Chromium's sandbox needs.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:desktop
      - if: runner.os != 'Linux'
        run: pnpm test:desktop

  # Self-contained packaging (owner decision 9, ADR 0021): the unpacked Linux app must carry the
  # daemon, and both the packaged app and an `npm install -g` of the CLI with its per-platform daemon
  # package must work with no Rust, Python, Node or npm on PATH (docs/release/packaging.md).
  package-smoke:
    name: Packaged smoke (clean machine)
    runs-on: ubuntu-latest
    env:
      # electron-builder downloads the Electron release it packages; the npm binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EXTALIA_REQUIRE_DAEMON: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Web UI, Desktop bundle, release daemon (staged + hello) and the unpacked app in release/linux-unpacked.
      - run: pnpm --filter @extalia/desktop dist:dir
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run --auto-servernum pnpm --filter @extalia/desktop smoke:packaged
      - run: pnpm --filter extalia-vo build
      - run: node tooling/build-daemon.mjs --out daemon-artifacts
      - run: node apps/cli/npm/generate.mjs --binaries daemon-artifacts --out npm-packages --cli
      - run: node tooling/clean-machine-smoke.mjs --npm npm-packages
