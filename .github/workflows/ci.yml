name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Lint, tests and builds do not need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node tooling/check-versions.mjs
      - name: Prepare executable artifact fixture
        if: runner.os == 'Linux'
        run: |
          node --input-type=module <<'JS'
          import { chmod, mkdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          const directory = path.join(process.env.RUNNER_TEMP, 'extalia-artifact-fixture');
          const executable = path.join(directory, 'bin', 'fixture');
          await mkdir(path.dirname(executable), { recursive: true });
          await writeFile(executable, 'Synthetic artifact fixture\n');
          await chmod(executable, 0o755);
          JS
          tar -czf "$RUNNER_TEMP/extalia-artifact-fixture.tar.gz" -C "$RUNNER_TEMP/extalia-artifact-fixture" .
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: artifact-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/extalia-artifact-fixture.tar.gz
          retention-days: 1
      - uses: actions/download-artifact@v8
        if: runner.os == 'Linux'
        with:
          pattern: artifact-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/extalia-artifact-download
          merge-multiple: true
      - name: Verify downloaded artifact content and execute mode
        if: runner.os == 'Linux'
        run: |
          mkdir "$RUNNER_TEMP/extalia-artifact-restored"
          tar -xzf "$RUNNER_TEMP/extalia-artifact-download/extalia-artifact-fixture.tar.gz" -C "$RUNNER_TEMP/extalia-artifact-restored"
          node --input-type=module <<'JS'
          import { readFile, stat } from 'node:fs/promises';
          import path from 'node:path';
          const executable = path.join(process.env.RUNNER_TEMP, 'extalia-artifact-restored', 'bin', 'fixture');
          const content = await readFile(executable, 'utf8');
          const metadata = await stat(executable);
          if (content !== 'Synthetic artifact fixture\n' || (metadata.mode & 0o777) !== 0o755) {
            throw new Error('Artifact transfer changed fixture contents or executable mode.');
          }
          JS

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Installs the exact toolchain, rustfmt and clippy pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # fmt --check, clippy -D warnings and tests, all --locked (same gate as pnpm check).
      - run: node tooling/check-rust.mjs
      # Host suites that need the real daemon binary; the `check` job skips them without Rust.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node tooling/check-rust.mjs --build-daemon
      # Include newly added planning, admission, recovery and scanner/learning suites;
      # the non-Rust check job alone would silently skip their real-daemon cases.
      # One file at a time: parallel daemons starve small Windows runners into startup timeouts.
      - run: pnpm exec vitest run packages/host/test --maxWorkers=1
        env:
          # A missing binary must fail this integration job rather than skip its coverage.
          EXTALIA_TEST_REQUIRE_DAEMON: '1'
      # Smoke check only, not a gate: the benchmark numbers are not compared in CI.
      - run: node tooling/bench/native-core.mjs --quick --json
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true

  desktop-smoke:
    name: Desktop smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu runners restrict unprivileged user namespaces, which Chromium's sandbox needs.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:desktop
      - if: runner.os != 'Linux'
        run: pnpm test:desktop

  # Self-contained packaging (owner decision 9, ADR 0021): the unpacked Linux app must carry the
  # daemon, and both the packaged app and an `npm install -g` of the CLI with its per-platform daemon
  # package must work with no Rust, Python, Node or npm on PATH (docs/release/packaging.md).
  package-smoke:
    name: Packaged smoke (clean machine)
    runs-on: ubuntu-latest
    env:
      # electron-builder downloads the Electron release it packages; the npm binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EXTALIA_REQUIRE_DAEMON: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Web UI, Desktop bundle, release daemon (staged + hello) and the unpacked app in release/linux-unpacked.
      - run: pnpm --filter @extalia/desktop dist:dir
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run --auto-servernum pnpm --filter @extalia/desktop smoke:packaged
      - run: pnpm --filter extalia-vo build
      - run: node tooling/build-daemon.mjs --out daemon-artifacts
      - run: node apps/cli/npm/generate.mjs --binaries daemon-artifacts --out npm-packages --cli
      - run: node tooling/clean-machine-smoke.mjs --npm npm-packages
