<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#181b22"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </radialGradient>

    <!-- Extalia Tri-Color Linear Gradient -->
    <linearGradient id="extalia-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#10b9ac"/>
      <stop offset="55%" stop-color="#83cb35"/>
      <stop offset="100%" stop-color="#f8e719"/>
    </linearGradient>

    <!-- Hermes Caduceus Gold Gradient -->
    <linearGradient id="hermes-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Top Title -->
  <text x="640" y="80" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" letter-spacing="1.5">
    EXTALIA SPATIAL WORKSPACE × HERMES AGENT
  </text>
  <text x="640" y="115" text-anchor="middle" fill="#8892b0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">
    Spatial 3D Observability &amp; Autonomous Agent Core Architecture
  </text>

  <!-- ================= LEFT CARD: EXTALIA VIRTUAL AGENT ================= -->
  <g transform="translate(100, 150)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect width="500" height="480" rx="28" fill="#14171f" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

    <!-- Extalia Symbol `/>` -->
    <g transform="translate(160, 60) scale(1.3)">
      <path d="M0 100L18 100L50 0L32 0Z" fill="url(#extalia-grad)"/>
      <path d="M68 0L91 0L141 50L91 100L68 100L118 50Z" fill="url(#extalia-grad)"/>
    </g>

    <!-- Extalia Title -->
    <text x="250" y="270" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">
      extalia
    </text>

    <!-- Caption -->
    <text x="250" y="310" text-anchor="middle" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="4">
      VIRTUAL AGENT
    </text>

    <!-- Description Badge -->
    <rect x="50" y="360" width="400" height="48" rx="14" fill="rgba(45, 212, 191, 0.08)" stroke="rgba(45, 212, 191, 0.25)"/>
    <text x="250" y="390" text-anchor="middle" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      Spatial 3D Agent Workspace &amp; Living Office
    </text>
  </g>

  <!-- ================= RIGHT CARD: HERMES AGENT ================= -->
  <g transform="translate(680, 150)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect width="500" height="480" rx="28" fill="#14171f" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

    <!-- Hermes Caduceus Symbol ☤ -->
    <g transform="translate(250, 140)">
      <!-- Outer Wing / Halo Arc -->
      <path d="M -80 -40 C -50 -75, 50 -75, 80 -40 C 50 -55, -50 -55, -80 -40 Z" fill="url(#hermes-gold)"/>
      <!-- Left Wing Plumes -->
      <path d="M -20 -30 C -70 -50, -95 -20, -55 10 C -30 20, -20 5, -20 -30 Z" fill="url(#hermes-gold)"/>
      <!-- Right Wing Plumes -->
      <path d="M 20 -30 C 70 -50, 95 -20, 55 10 C 30 20, 20 5, 20 -30 Z" fill="url(#hermes-gold)"/>
      <!-- Entwined Serpents Body (Lower coil) -->
      <path d="M 0 45 C -40 30, -40 0, 0 -10 C 40 0, 40 30, 0 45 Z" fill="none" stroke="url(#hermes-gold)" stroke-width="7" stroke-linecap="round"/>
      <!-- Upper coil -->
      <path d="M 0 0 C -30 -12, -30 -38, 0 -45 C 30 -38, 30 -12, 0 0 Z" fill="none" stroke="url(#hermes-gold)" stroke-width="6" stroke-linecap="round"/>
      <!-- Central Staff -->
      <line x1="0" y1="-65" x2="0" y2="70" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <!-- Staff Crown Sphere -->
      <circle cx="0" cy="-68" r="10" fill="url(#hermes-gold)"/>
    </g>

    <!-- Hermes Title -->
    <text x="250" y="270" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">
      Hermes Agent
    </text>

    <!-- Caption -->
    <text x="250" y="310" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="4">
      AUTONOMOUS CORE
    </text>

    <!-- Description Badge -->
    <rect x="50" y="360" width="400" height="48" rx="14" fill="rgba(251, 191, 36, 0.08)" stroke="rgba(251, 191, 36, 0.25)"/>
    <text x="250" y="390" text-anchor="middle" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      Nous Research General Agentic Runtime
    </text>
  </g>
</svg>
